# ตั้งค่า Cloudflare Workers (เซิร์ฟเวอร์หลายห้อง) — deploy ด้วย: npx wrangler deploy
name = "chem-arena"
main = "server/worker.js"
compatibility_date = "2025-01-01"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "RoomDO"

[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "DirectoryDO"

# แพลนฟรีต้องใช้ SQLite-backed Durable Objects (new_sqlite_classes)
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO", "DirectoryDO"]
